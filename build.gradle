tasks.register('verifyNeuro', JavaExec) {
    group = 'verification'
    description = 'Checks learned TCN parity, visible camera, commands, manual isolation, bots and world lifecycle.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'pizza.dlc.NeuroCheck'
    systemProperty 'pizzadlc.neuro.processCheck', project.hasProperty('neuroProcessCheck')
    if (project.hasProperty('neuroModelCheck')) {
        systemProperty 'pizzadlc.neuro.checkModel', project.property('neuroModelCheck')
        systemProperty 'pizzadlc.neuro.checkRoot', rootProject.file('run/pizzadlc/neuro').absolutePath
    }
}
tasks.named('check') { dependsOn tasks.named('verifyNeuro') }


tasks.register('neuroClientTestMod', Jar) {
    dependsOn tasks.named('verificationClasses')
    archiveFileName = 'neuro-client-check.jar'
    destinationDirectory = layout.buildDirectory.dir('neuro-client-test')
    from sourceSets.verification.output
    from 'src/clientVerification/resources'
}
if (project.hasProperty('neuroClientTest')) {
    loom.runs.named('client') { runDir('build/neuro-client-test/game') }
    tasks.named('runClient') {
        dependsOn tasks.named('neuroClientTestMod')
        workingDir = layout.buildDirectory.dir('neuro-client-test/game').get().asFile
        if (project.hasProperty('neuroLiveTrainingCheck')) {
            if (project.hasProperty('neuroLiveModel')) jvmArgs '-Dpizzadlc.neuro.liveModel=' + project.property('neuroLiveModel')
            jvmArgs '-Dpizzadlc.neuro.liveCheck=true', '-Dpizzadlc.neuro.python=' + rootProject.file('.neuro-runtime/Scripts/python.exe').absolutePath
        }
        jvmArgs '-Dfabric.client.gametest', '-Dfabric.client.gametest.modid=neuro-verification',
            '-Dfabric.addMods=' + layout.buildDirectory.file('neuro-client-test/neuro-client-check.jar').get().asFile.absolutePath
        doFirst {
            workingDir.mkdirs()
            def testArgs = new ArrayList(args)
            def index = testArgs.indexOf('--gameDir')
            if (index >= 0) testArgs[index + 1] = workingDir.absolutePath
            else testArgs.addAll(['--gameDir', workingDir.absolutePath])
            testArgs.addAll(['--width', '960', '--height', '640'])
            setArgs(testArgs)
        }
    }
}

