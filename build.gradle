plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ONNX Runtime (нейронка для аим-гуманизатора), вместо вложенного META-INF/jars/onnxruntime-1.20.0.jar
    implementation "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"

    // только аннотация @Generated из декомпилированных сорсов
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"

    // Lua-рантайм для AnimatedHands (порт Hold My Items), вшивается в jar
    implementation files('libs/luaj-jse-3.0.1.jar')
}

jar {
    from(zipTree('libs/luaj-jse-3.0.1.jar')) {
        exclude 'META-INF/**'
        // Lua classes are shaded into PizzaDLC; keep PizzaDLC's own mod metadata.
        exclude 'fabric.mod.json'
    }
}

loom {
    accessWidenerPath = file("src/main/resources/pizzadlc.accesswidener")
}

def targetJavaVersion = project.target_java_version.toInteger()

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(targetJavaVersion)
    it.options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xmaxwarns' << '10000'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

sourceSets {
    verification {
        java.srcDir('src/verification/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('verifyCleanRenderScope', JavaExec) {
    group = 'verification'
    description = 'Checks clean capture isolation, camera interpolation, and persisted module state.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'pizza.dlc.CleanRenderScopeCheck'
}

tasks.named('check') {
    dependsOn tasks.named('verifyCleanRenderScope')
}

